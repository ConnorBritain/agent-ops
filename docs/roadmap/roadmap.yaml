meta:
  schema_version: 1
  program: AGENT-OPS
  north_star: docs/specs/SPEC-000-program-charter.md
  updated: "2026-07-30"
  default_gate: pnpm validate
  branch_convention: "{pi}/{sprint}"
  terminal: print
  default_concurrency: 1
  worker_mode: plan
  agent_cmd: "codex --permission-mode {mode} {prompt}"
  base_branch: main
  remote: origin
  default_weight: light
  links:
    narrative: docs/specs/SPEC-000-program-charter.md
    status: docs/status/current.md
    tracker: docs/traceability/phase-4-print-provider.yaml
    bootstrap: docs/specs/BUILD-001-initial-implementation-prompt.md
pis:
  - id: phase-0-governance
    title: Governed public bootstrap
    status: complete
    summary: Create the public template, specifications, evidence gates, and private-overlay boundary without infrastructure changes.
    exit_criteria: Governance validation passes, bootstrap PR is scoped correctly, and private overlay is seeded separately.
    detail: docs/status/current.md
    priority:
      tier: P0
      weight: 100
      reason: Required foundation for every later slice.
    sprints:
      - id: governed-scaffold
        title: Public governed scaffold
        status: complete
        invoke: governed-scaffold
        what: Publish the public Phase 0 specification, acceptance, ADR, Roadmap, and validation baseline.
        est_sessions: 0
        weight: light
        touches:
          - package.json
          - docs/
          - tools/
          - .github/
        gate: default
        completed_on: "2026-07-28"
        read_order:
          - docs/specs/catalog.yaml
          - docs/specs/BUILD-001-initial-implementation-prompt.md
          - docs/status/current.md
        resume_action: Complete validation and publish the governed bootstrap pull request.
        priority:
          tier: P0
          weight: 100
          reason: Establishes mandatory governance before runtime work.
        prompt: Keep the public template generalized and make no host, credential, deployment, or remote-access changes.
      - id: private-overlay
        title: Seed private implementation overlay
        status: complete
        invoke: private-overlay
        what: Seed the private repository from the public bootstrap and isolate confidential source material.
        est_sessions: 0
        weight: light
        deps: [governed-scaffold]
        touches:
          - docs/private/
          - config/private/
        gate: default
        completed_on: "2026-07-28"
        read_order:
          - docs/adr/ADR-0006-public-template-private-overlay.md
          - docs/status/current.md
        resume_action: Verify private remote, upstream tracking, source-document exclusion from public history, and secret-safe overlay structure.
        priority:
          tier: P0
          weight: 90
          reason: Required before private implementation work.
        prompt: Keep all real host, identity, network, relay, and secret-reference material private.
  - id: phase-1-private-host-baseline
    title: Private host baseline and RustDesk enrollment planning
    status: gated
    deps: [phase-0-governance]
    summary: Collect owner authorization and private deployment facts before any host or relay change.
    exit_criteria: Owner authorization, private inventory, security design, and a reversible approved bootstrap plan exist.
    detail: docs/specs/SPEC-010-network-and-host-bootstrap.md
    priority:
      tier: P1
      weight: 80
      reason: Required before worker runtime installation.
    sprints:
      - id: host-baseline
        title: Private host baseline
        status: gated
        invoke: private-host-baseline
        what: Record owner-authorized private inventory and evaluate RustDesk enrollment without changing hosts.
        est_sessions: 1
        weight: light
        gated_on: private owner authorization and relay-security decision
        gate: default
        read_order:
          - docs/specs/SPEC-003-trust-security-and-federation.md
          - docs/specs/SPEC-010-network-and-host-bootstrap.md
          - docs/specs/SPEC-019-host-inventory-and-initial-fleet.md
          - docs/architecture/remote-access.md
        resume_action: Wait for explicit owner authorization and finalized private relay topology.
        priority:
          tier: P1
          weight: 80
          reason: Protects owners, hosts, and security boundary.
        prompt: Work only in the private overlay. Do not install, enroll, or configure any host or remote-access system without explicit authorization.
  - id: phase-2-durable-core
    title: Supabase durable operational core
    status: gated
    deps: [phase-0-governance]
    summary: Implement durable contracts and database authority locally before any hosted integration or worker automation.
    exit_criteria: Unit and pgTAP tests prove versioned contracts, scoped access, idempotent events, outbox delivery state, lease fencing, lineage, and no automatic restart.
    detail: docs/status/current.md
    priority:
      tier: P0
      weight: 100
      reason: Durable truth is required before Coordinator, worker, provider, or chat execution.
    sprints:
      - id: supabase-core
        title: Local durable schema, contracts, RLS, outbox, and Coordinator lease
        status: complete
        invoke: supabase-durable-core
        what: Add TypeScript domain/adapter packages and local Supabase migrations and tests without connecting a hosted project.
        est_sessions: 0
        weight: medium
        gate: pnpm validate plus pnpm test:db and pnpm db:lint
        completed_on: "2026-07-29"
        touches:
          - packages/
          - supabase/
          - tools/
          - docs/
          - .github/
        read_order:
          - docs/specs/SPEC-003-trust-security-and-federation.md
          - docs/specs/SPEC-004-domain-data-and-identity.md
          - docs/specs/SPEC-005-commands-events-and-idempotency.md
          - docs/specs/SPEC-006-coordinator-runtime.md
        resume_action: Preserve the green local and CI evidence; hosted application remains a separately authorized private-overlay slice.
        priority:
          tier: P0
          weight: 100
          reason: This is the completed executable foundation for the first product vertical slice.
        prompt: Use database time, explicit grants, RLS, append-only events, a transactional outbox, scoped identities, and stale-leader rejection. Do not connect or mutate a hosted project.
      - id: supabase-remote-verification
        title: Private hosted-project application and verification
        status: gated
        invoke: supabase-remote-verification
        what: Apply the reviewed migration through a private overlay, run advisors and acceptance checks, and record secret-safe evidence.
        est_sessions: 1
        weight: light
        deps: [supabase-durable-core]
        gated_on: Private project authorization, scoped connection, backup decision, and secret-plane identity provisioning
        gate: Private overlay validation plus remote migration, RLS, advisor, and rollback evidence
        read_order:
          - docs/specs/SPEC-003-trust-security-and-federation.md
          - docs/specs/SPEC-015-deployment-upgrades-and-disaster-recovery.md
        resume_action: Wait for the private overlay to supply authorization and scoped references; never place them in this public repository.
        priority:
          tier: P1
          weight: 80
          reason: Hosted verification is required before a private runtime can rely on the schema.
        prompt: Work only through an authorized private overlay. Never store project references, URLs, credentials, account identities, or deployment topology in public.
  - id: phase-3-worker-safety
    title: Outbound worker runtime and host safeguards
    status: gated
    deps: [phase-0-governance, phase-2-durable-core]
    summary: Build the transport-neutral worker supervisor, deterministic preflight policy, health collectors, and service packaging without enrolling a real host.
    exit_criteria: Deterministic fixtures prove registration, heartbeats, resource refusal, cancellation, quarantine, and reboot-idle recovery; private canary enrollment remains separately gated.
    detail: docs/specs/SPEC-007-worker-runtime-and-reboot-recovery.md
    priority:
      tier: P0
      weight: 100
      reason: A safe worker boundary is required before any real provider can run.
    sprints:
      - id: worker-runtime-core
        title: Worker supervisor, manifests, preflight, and normalized health
        status: complete
        invoke: worker-runtime-core
        what: Implement a transport-neutral worker state machine, capability and skill manifests, leased-job validation, heartbeats, and safe cancellation using deterministic ports and fixtures.
        est_sessions: 0
        weight: medium
        deps: [supabase-durable-core]
        gate: pnpm validate plus worker contract and preflight fixtures
        completed_on: "2026-07-30"
        touches:
          - packages/contracts/
          - packages/domain/
          - packages/worker/
          - packages/test-kit/
          - docs/
        read_order:
          - docs/specs/catalog.yaml
          - docs/status/current.md
          - docs/status/blockers.md
          - docs/specs/SPEC-003-trust-security-and-federation.md
          - docs/specs/SPEC-005-commands-events-and-idempotency.md
          - docs/specs/SPEC-007-worker-runtime-and-reboot-recovery.md
          - docs/specs/SPEC-009-hooks-health-and-safeguards.md
          - docs/specs/SPEC-017-testing-verification-and-release-gates.md
        resume_action: Preserve the transport-neutral contract and green fixtures; service installation and host authentication remain separately gated.
        priority:
          tier: P0
          weight: 100
          reason: This is the next autonomous local slice in the normative rollout order.
        prompt: Keep the worker outbound-only, deny incompatible or expired work before launch, emit idempotent normalized observations, and remain idle after reboot until the Coordinator authorizes recovery.
      - id: worker-safety-hooks
        title: Independent safety collectors, drain, and quarantine
        status: complete
        invoke: worker-safety-hooks
        what: Implement resource, worktree, process, stale-session, and unsafe-delete policy hooks with dry-run remediation and independent monitor scheduling.
        est_sessions: 0
        weight: medium
        deps: [worker-runtime-core]
        gate: Safety decision matrix and hung-agent monitor fixtures
        completed_on: "2026-07-30"
        touches:
          - packages/domain/
          - packages/worker/
          - packages/policy/
          - packages/test-kit/
          - docs/
        read_order:
          - docs/specs/SPEC-003-trust-security-and-federation.md
          - docs/specs/SPEC-009-hooks-health-and-safeguards.md
          - docs/specs/SPEC-016-observability-operations-and-runbooks.md
          - docs/specs/SPEC-017-testing-verification-and-release-gates.md
        resume_action: Preserve the policy-only boundary; use the reviewed static service-definition slice before any private enrollment.
        priority:
          tier: P0
          weight: 95
          reason: Real provider launch is forbidden until host safeguards are independently enforceable.
        prompt: Default cleanup to dry-run, resolve destructive targets explicitly, preserve evidence, and make critical findings drain or quarantine the worker.
      - id: worker-service-packaging
        title: Versioned launchd, systemd, and Windows service definitions
        status: complete
        invoke: worker-service-packaging
        what: Package reviewed service definitions and clean-host verification scripts for supported operating systems without installing them.
        est_sessions: 0
        weight: light
        deps: [worker-safety-hooks]
        gate: Static service-definition checks plus disposable reboot-idle fixtures
        completed_on: "2026-07-30"
        touches:
          - deploy/
          - config/
          - docs/runbooks/
          - packages/test-kit/
        read_order:
          - docs/specs/SPEC-007-worker-runtime-and-reboot-recovery.md
          - docs/specs/SPEC-010-network-and-host-bootstrap.md
          - docs/specs/SPEC-015-deployment-upgrades-and-disaster-recovery.md
        resume_action: Preserve static-template boundaries; private canary installation remains separately authorized.
        priority:
          tier: P1
          weight: 85
          reason: Reproducible packaging is required before a private canary.
        prompt: Start only the supervisor after boot, never an agent workload, use dedicated identities, and document uninstall and rollback paths.
      - id: private-worker-canary
        title: Private disposable worker enrollment and reboot proof
        status: gated
        invoke: private-worker-canary
        what: Through an authorized private overlay, enroll one safety-compliant personal host and prove restart-idle behavior plus human-operated headless remote access.
        est_sessions: 1
        weight: light
        deps: [worker-service-packaging, private-host-baseline]
        gated_on: Private owner authorization, safe host baseline, scoped identity, and reviewed rollback plan
        gate: Private reboot, registration, capability-health, resource refusal, cancellation, headless RustDesk authorization and lock-screen access, and unenrollment evidence
        read_order:
          - docs/specs/SPEC-003-trust-security-and-federation.md
          - docs/specs/SPEC-007-worker-runtime-and-reboot-recovery.md
          - docs/specs/SPEC-010-network-and-host-bootstrap.md
          - docs/specs/SPEC-019-host-inventory-and-initial-fleet.md
          - docs/architecture/remote-access.md
        resume_action: Wait for a private overlay to identify an eligible host and explicitly authorize enrollment.
        priority:
          tier: P1
          weight: 80
          reason: A real canary is required before normal worker use.
        prompt: Keep all host, network, identity, and service evidence private; stop if any safety threshold or authorization is missing.
  - id: phase-4-roadmap-print-provider
