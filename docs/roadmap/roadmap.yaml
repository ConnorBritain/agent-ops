    exit_criteria: A bounded fixture resolves a ready slice, retains stable correlation references, and produces a complete no-execution launch plan through the shared provider conformance suite.
    detail: docs/specs/SPEC-011-roadmap-portfolio-github-and-chat-integration.md
    priority:
