name: Governance validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate
      - run: pnpm roadmap:render
      - run: git diff --exit-code -- docs/SLICES.md docs/BACKLOG.md

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: supabase/setup-cli@v2
        with:
          version: 2.110.0
      - name: Start minimal local Supabase database
        run: >-
          supabase start
          --exclude gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Run migration and RLS acceptance tests
        run: supabase test db supabase/tests --local
      - name: Lint durable schemas
        run: supabase db lint --local --schema agentops,agentops_audit,agentops_private --level warning --fail-on error
      - name: Stop local Supabase database
        if: always()
        run: supabase stop --no-backup
